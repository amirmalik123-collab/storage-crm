<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>StorageCRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Page backgrounds (light, like Replit) ── */
  --bg:#f3f5f8;          /* page background: cool light grey */
  --surface:#ffffff;     /* cards / panels: pure white */
  --surface2:#f0f2f6;    /* subtle inset / inputs / table headers */
  --surface3:#e4e7ef;    /* hover states, deeper inset */

  /* ── Borders ── */
  --border:#dde1ec;      /* main border */
  --border2:#c8cfe0;     /* stronger border */

  /* ── Text ── */
  --text:#1a1f36;        /* primary text: near-black with blue tint */
  --text2:#4a5368;       /* secondary text */
  --text3:#5f6882;       /* muted / placeholder — readable at small sizes */

  /* ── Accent colours (kept vivid so badges still pop) ── */
  --blue:#2563eb;        --blue-dim:#dbeafe;   --blue-glow:rgba(37,99,235,.08);
  --green:#16a34a;       --green-dim:#dcfce7;  --green-glow:rgba(22,163,74,.08);
  --red:#dc2626;         --red-dim:#fee2e2;
  --orange:#ea580c;      --orange-dim:#ffedd5;
  --amber:#d97706;       --amber-dim:#fef3c7;  --amber-dim2:#fde68a;

  /* ── Sidebar (keep dark — matches Replit's dark-sidebar / light-body pattern) ── */
  --sidebar-bg:#1e2640;      /* deep navy */
  --sidebar-surface:#252d47; /* slightly lighter for hover */
  --sidebar-border:#2e3857;
  --sidebar-text:#c8d0e8;
  --sidebar-text2:#7b89ab;
  --sidebar-active-bg:rgba(37,99,235,.18);
  --sidebar-active-text:#93b4fd;
  --sidebar-active-border:#3b5bdb;

  /* ── Typography ── */
  --mono:'Space Mono',monospace;
  --sans:'Plus Jakarta Sans',sans-serif;
  --radius:8px;--radius-lg:12px;
}
html,body,#root{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Layout ── */
.app-shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:170px;min-width:170px;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;padding:0}
.sidebar-logo{padding:14px 12px 12px;border-bottom:1px solid var(--sidebar-border)}
.logo-mark{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.12em;color:var(--sidebar-text2);text-transform:uppercase;margin-bottom:3px}
.logo-name{font-size:13px;font-weight:700;color:var(--sidebar-text);letter-spacing:-.3px}
.logo-name span{color:#60a5fa}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-section{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sidebar-text2);padding:12px 10px 6px}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:var(--radius);cursor:pointer;color:var(--sidebar-text);font-size:12.5px;font-weight:500;transition:all .15s;margin-bottom:1px;border:1px solid transparent}
.nav-item:hover{background:var(--sidebar-surface);color:#e4eaff}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);border-color:var(--sidebar-active-border)}
.nav-item svg{flex-shrink:0;opacity:.8}
.nav-item.active svg{opacity:1}
.sidebar-footer{padding:12px 8px;border-top:1px solid var(--sidebar-border)}
.user-pill{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);background:var(--sidebar-surface)}
.avatar{width:28px;height:28px;border-radius:50%;background:rgba(37,99,235,.25);border:1px solid rgba(37,99,235,.4);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;color:#93b4fd;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sidebar-text)}
.user-role{font-size:10px;color:var(--sidebar-text2)}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:46px;border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.page-title{font-size:14px;font-weight:600;color:var(--text)}
.page-subtitle{font-size:12px;color:var(--text2);margin-top:1px}
.topbar-actions{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);border:1px solid;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:var(--sans)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:#2563eb;border-color:#2563eb}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text2)}
.btn-ghost:hover{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.btn-danger{background:transparent;border-color:var(--red-dim);color:var(--red)}
.btn-danger:hover{background:var(--red-dim)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── KPI cards ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi-card.blue::before{background:var(--blue)}
.kpi-card.green::before{background:var(--green)}
.kpi-card.orange::before{background:var(--orange)}
.kpi-card.red::before{background:var(--red)}
.kpi-card.amber::before{background:var(--amber)}
.kpi-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);margin-bottom:8px}
.kpi-value{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--text);line-height:1}
.kpi-value.blue{color:var(--blue)}
.kpi-value.green{color:var(--green)}
.kpi-value.orange{color:var(--orange)}
.kpi-value.red{color:var(--red)}
.kpi-value.amber{color:var(--amber)}
.kpi-sub{font-size:12px;color:var(--text2);margin-top:4px}

/* ── Table ── */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0;margin:20px 24px}
.table-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px 7px 32px;color:var(--text);font-size:13px;outline:none;font-family:var(--sans);transition:border-color .15s}
.search-box input:focus{border-color:var(--blue)}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text3)}
.filter-select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;color:var(--text);font-size:13px;outline:none;cursor:pointer;font-family:var(--sans)}
.filter-select:focus{border-color:var(--blue)}
.table-scroll{overflow:auto;flex:1;min-height:0}
table{min-width:1000px}
.table-scroll::-webkit-scrollbar{width:10px;height:10px}
.table-scroll::-webkit-scrollbar-track{background:var(--surface2);border-radius:4px}
.table-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;border:2px solid var(--surface2)}
.table-scroll::-webkit-scrollbar-thumb:hover{background:var(--text3)}
.table-scroll::-webkit-scrollbar-corner{background:var(--surface2)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:8px 10px;text-align:left;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;user-select:none}
thead th.sortable{cursor:pointer;transition:background .12s,color .12s}
thead th.sortable:hover{background:var(--surface3);color:var(--text)}
thead th.sorted{color:var(--blue);background:var(--blue-glow)}
.sort-indicator{display:inline-flex;flex-direction:column;gap:1px;margin-left:5px;opacity:.5;vertical-align:middle;line-height:0}
thead th.sorted .sort-indicator{opacity:1}
.sort-indicator span{font-size:7px;line-height:1;font-family:var(--mono)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
tbody tr.occupied{background:rgba(22,163,74,.04)}
tbody tr.occupied:hover{background:rgba(22,163,74,.09)}
tbody tr.expiring{background:rgba(234,88,12,.05)}
tbody tr.expiring:hover{background:rgba(234,88,12,.1)}
td{padding:9px 10px;color:var(--text);vertical-align:middle;white-space:nowrap;font-size:13px}
td.primary{color:var(--text);font-weight:500;font-family:var(--mono);font-size:12px}
td.notes-cell{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.empty-row td{text-align:center;padding:40px;color:var(--text3)}

/* ── Status + badges ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;font-family:var(--mono);letter-spacing:.05em;white-space:nowrap}
.badge-occupied{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.badge-reserved{background:#ede9fe;color:#6d28d9;border:1px solid #c4b5fd}
.badge-vacant{background:var(--surface3);color:var(--text3);border:1px solid var(--border)}
.badge-paid{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.badge-overdue{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}
.badge-pending{background:#fef3c7;color:#b45309;border:1px solid #fde68a}
.badge-dd{background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe}
.badge-yes{color:var(--green);font-size:12px}
.badge-no{color:var(--text3);font-size:12px}
.expiry-warn{color:var(--orange);font-family:var(--mono);font-size:12px}
.expiry-ok{color:var(--text3);font-family:var(--mono);font-size:12px}
.expiry-expired{color:var(--red);font-family:var(--mono);font-size:12px}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(30,38,64,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:700px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(30,38,64,.18)}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text2)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 10px;color:var(--text);font-size:13px;outline:none;width:100%;
  font-family:var(--sans);transition:border-color .15s;
  color-scheme:light
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:var(--surface3)}
textarea{resize:vertical;min-height:64px}
.checkbox-row{display:flex;align-items:center;gap:8px;padding:9px 0}
.checkbox-row label{text-transform:none;letter-spacing:0;font-size:13px;font-weight:400;color:var(--text);cursor:pointer}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
.form-section{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);padding:14px 0 8px;border-bottom:1px solid var(--border);margin-bottom:14px;grid-column:1/-1}
.form-error{color:var(--red);font-size:12px;margin-top:4px}

/* ── Alert/notice ── */
.alert{padding:12px 16px;border-radius:var(--radius);font-size:13px;display:flex;align-items:flex-start;gap:8px;margin-bottom:16px}
.alert-warn{background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.25);color:var(--orange)}
.alert-info{background:var(--blue-glow);border:1px solid var(--blue-dim);color:var(--blue)}

/* ── Login page ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(30,38,64,.1)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo-mark{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--text3);text-transform:uppercase;margin-bottom:8px}
.login-logo-name{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.login-logo-name span{color:var(--blue)}
.login-card h2{font-size:17px;font-weight:600;margin-bottom:4px}
.login-card p{color:var(--text3);font-size:13px;margin-bottom:24px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.login-error{color:#dc2626;font-size:13px;padding:10px;background:#fee2e2;border-radius:var(--radius);margin-bottom:14px;text-align:center}
.login-btn{width:100%;padding:10px;font-size:14px;font-weight:600;background:var(--blue);border:none;border-radius:var(--radius);color:#fff;cursor:pointer;transition:background .15s;font-family:var(--sans)}
.login-btn:hover{background:#2563eb}
.login-hint{text-align:center;font-size:11px;color:var(--text3);margin-top:16px;font-family:var(--mono)}

/* ── Expiry section ── */
.expiry-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.expiry-item{background:var(--surface);border:1px solid rgba(249,115,22,.3);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:14px}
.expiry-days{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--orange);min-width:40px}
.expiry-info{flex:1}
.expiry-container{font-weight:600;font-size:13px}
.expiry-customer{font-size:12px;color:var(--text2)}
.section-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title svg{color:var(--orange)}

/* ── Settings page ── */
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:16px}
.settings-card h3{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--text)}
.users-table{width:100%;border-collapse:collapse;font-size:13px}
.users-table th{text-align:left;padding:8px 12px;font-size:10px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border)}
.users-table td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text2)}
.users-table tr:last-child td{border-bottom:none}

/* ── Inline toggle checkboxes ── */
.toggle-check{background:none;border:none;cursor:pointer;font-size:14px;padding:4px 8px;border-radius:4px;transition:background .15s;color:var(--green);min-width:28px}
.toggle-check:hover{background:var(--surface3);border-radius:4px}

/* ── Responsive: hide less-critical columns on narrow screens ── */
@media(max-width:1100px){
  .col-hide{display:none;}
}

/* ── Loading / toast ── */
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:2000;animation:slideUp .2s ease;max-width:320px}
.toast.success{border-color:var(--green-dim);color:var(--green)}
.toast.error{border-color:var(--red-dim);color:var(--red)}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── Responsive ── */
@media(max-width:900px){
  .sidebar{display:none}
  .form-grid{grid-template-columns:1fr}
  .form-grid.cols-3{grid-template-columns:1fr 1fr}
}

/* ── Customers / detail ── */
.cust-toolbar{padding:14px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.cust-search-wrap{position:relative;flex:1;max-width:340px}
.cust-search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.cust-search-wrap input{width:100%;padding:7px 10px 7px 32px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;font-family:var(--sans)}
.cust-search-wrap input:focus{outline:none;border-color:var(--blue);background:var(--surface3)}
.cust-row{cursor:pointer;transition:background .12s}
.cust-row:hover td{background:var(--surface2)}
.cust-row td:first-child span{color:var(--blue);font-weight:500}
.cust-active-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--blue-glow);color:var(--blue);border:1px solid var(--blue-dim);border-radius:10px;font-size:11px;font-weight:600;padding:1px 8px;font-family:var(--mono)}
.detail-hero{padding:18px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.back-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);background:var(--surface2);border:1px solid var(--border);cursor:pointer;color:var(--text2);flex-shrink:0;transition:all .15s}
.back-btn:hover{background:var(--surface3);color:var(--text)}
.hero-avatar{width:40px;height:40px;border-radius:50%;background:var(--blue-dim);border:1px solid var(--blue-dim);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;font-weight:700;color:var(--blue);flex-shrink:0}
.hero-name{font-size:19px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.hero-sub{font-size:12px;color:var(--text2);margin-top:2px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 24px}
.detail-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.detail-card-title{font-size:11px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:14px;font-weight:700}
.detail-info-row{display:flex;align-items:flex-start;gap:9px;margin-bottom:11px;font-size:13px;color:var(--text2)}
.detail-info-row:last-child{margin-bottom:0}
.detail-info-row svg{flex-shrink:0;margin-top:1px;color:var(--text3)}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none;padding-top:9px;margin-top:2px}
.stat-row .slabel{color:var(--text2)}
.stat-row .sval{font-weight:600;color:var(--text)}
.stat-row .sval.highlight{font-size:17px;color:var(--green)}
.detail-section{padding:0 24px 20px}
.detail-section-title{display:flex;align-items:center;gap:7px;font-size:11px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text2);font-weight:700;padding:12px 0 8px;border-bottom:1px solid var(--border);margin-bottom:0}
.rental-status-active{color:var(--green);background:var(--green-glow);border:1px solid var(--green-dim);border-radius:10px;font-size:11px;padding:1px 8px;font-weight:600;font-family:var(--mono)}
.rental-status-ended{color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:11px;padding:1px 8px;font-weight:600;font-family:var(--mono)}
.rental-status-pending{color:var(--amber);background:rgba(245,158,11,.1);border:1px solid var(--amber-dim);border-radius:10px;font-size:11px;padding:1px 8px;font-weight:600;font-family:var(--mono)}
.skel{height:13px;background:var(--surface3);border-radius:3px;animation:skelPulse 1.4s ease-in-out infinite;display:inline-block}
/* ── Income calendar ── */
.income-calendar{padding:16px 24px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:9px;font-family:var(--mono);font-weight:600;color:var(--text3);padding:2px 0;text-transform:uppercase}
.cal-day{border-radius:6px;padding:4px 5px;min-height:52px;background:var(--surface2);border:1px solid var(--border);position:relative;cursor:default;transition:all .15s}
.cal-day.has-income{background:#f0fdf4;border-color:#bbf7d0;cursor:pointer}
.cal-day.has-income:hover{background:#dcfce7;border-color:#86efac}
.cal-day.is-today{border-color:var(--blue);background:var(--blue-glow)}
.cal-day.is-today.has-income{border-color:#16a34a;background:#dcfce7}
.cal-day.is-past{opacity:.55}
.cal-day.empty{background:transparent;border-color:transparent;min-height:52px}
.cal-day-num{font-size:10px;font-weight:700;color:var(--text2);font-family:var(--mono);line-height:1}
.cal-day.has-income .cal-day-num{color:var(--text)}
.cal-day.is-today .cal-day-num{color:var(--blue)}
.cal-day-amount{font-size:10px;font-weight:700;color:#15803d;margin-top:3px;font-family:var(--mono);line-height:1.1}
.cal-day-count{font-size:9px;color:var(--text2);margin-top:2px;font-family:var(--mono);font-weight:600}
.cal-tooltip{position:absolute;z-index:50;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);border-radius:8px;padding:8px 10px;font-size:11px;min-width:160px;max-width:220px;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.cal-tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--text)}
.cal-tooltip-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;font-size:10px}
.cal-tooltip-row:last-child{margin-bottom:0}
.income-toolbar{padding:12px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.income-period-nav{display:flex;align-items:center;gap:4px}
.period-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;color:var(--text2);transition:all .15s;font-size:14px}
.period-btn:hover{background:var(--surface3);color:var(--text)}
.period-label{font-size:13px;font-weight:700;color:var(--text);min-width:110px;text-align:center;font-family:var(--mono)}
.income-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
.income-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px}
.income-stat-label{font-size:10px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:6px;font-weight:700}
.income-stat-value{font-size:20px;font-weight:700;letter-spacing:-.5px}
.income-stat-sub{font-size:12px;color:var(--text2);margin-top:3px}
.income-stat.green .income-stat-value{color:var(--green)}
.income-stat.red .income-stat-value{color:var(--red)}
.income-stat.amber .income-stat-value{color:var(--amber)}
.income-stat.blue .income-stat-value{color:var(--blue)}
@media(max-width:900px){.income-summary{grid-template-columns:1fr 1fr}}
@keyframes skelPulse{0%,100%{opacity:.5}50%{opacity:1}}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr}}
</style>

const {useState,useEffect,useCallback,useRef,createContext,useContext}=React;

// ── API helper ────────────────────────────────────────────────────────────────
const api=async(path,opts={})=>{
  const token=localStorage.getItem('crm_token');
  const headers={'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})};
  const r=await fetch('/api'+path,{headers,...opts,body:opts.body?JSON.stringify(opts.body):undefined});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.error||'Request failed');
  return data;
};

// ── Context ───────────────────────────────────────────────────────────────────
const AppCtx=createContext(null);
function useApp(){return useContext(AppCtx);}

// ── Sorting helpers ───────────────────────────────────────────────────────────
function useSortedData(data, defaultKey, defaultDir){
  const[sortKey,setSortKey]=useState(defaultKey||null);
  const[sortDir,setSortDir]=useState(defaultDir||'asc');
  const toggle=(key)=>{
    if(sortKey===key)setSortDir(d=>d==='asc'?'desc':'asc');
    else{setSortKey(key);setSortDir('asc');}
  };
  const sorted=React.useMemo(()=>{
    if(!data||!sortKey)return data||[];
    return [...data].sort((a,b)=>{
      let av=a[sortKey],bv=b[sortKey];
      if(av==null&&bv==null)return 0;
      if(av==null)return 1;
      if(bv==null)return -1;
      if(typeof av==='string'&&/^\d{4}-\d{2}-\d{2}/.test(av))av=new Date(av);
      if(typeof bv==='string'&&/^\d{4}-\d{2}-\d{2}/.test(bv))bv=new Date(bv);
      if(av instanceof Date&&bv instanceof Date)return sortDir==='asc'?av-bv:bv-av;
      if(typeof av==='number'&&typeof bv==='number')return sortDir==='asc'?av-bv:bv-av;
      return sortDir==='asc'?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));
    });
  },[data,sortKey,sortDir]);
  return{sorted,sortKey,sortDir,toggle};
}
function SortableTh({label,sortK,current,dir,onSort,style}){
  const active=current===sortK;
  return React.createElement('th',{className:'sortable'+(active?' sorted':''),style,onClick:()=>onSort(sortK)},
    label,
    React.createElement('span',{className:'sort-indicator'},
      React.createElement('span',{style:{opacity:active&&dir==='asc'?1:.25}},'▲'),
      React.createElement('span',{style:{opacity:active&&dir==='desc'?1:.25}},'▼')
    )
  );
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const fmt=(v)=>v?new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const payBadge=(s)=>{
  if(!s)return null;
  const cls={Paid:'badge-paid',Overdue:'badge-overdue',Pending:'badge-pending','Direct Debit':'badge-dd','Credit Note':'badge-dd'}[s]||'badge-pending';
  return React.createElement('span',{className:`badge ${cls}`},s);
};
const statusBadge=(s)=>{
  if(s==='Occupied') return React.createElement('span',{className:'badge badge-occupied'},'● OCCUPIED');
  if(s==='Reserved') return React.createElement('span',{className:'badge badge-reserved'},'◆ RESERVED');
  return React.createElement('span',{className:'badge badge-vacant'},'○ VACANT');
};
const bool=(v)=>React.createElement('span',{className:v?'badge-yes':'badge-no'},v?'✓':'—');

// ── Toast ─────────────────────────────────────────────────────────────────────
function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3200);return()=>clearTimeout(t)},[]);
  return React.createElement('div',{className:`toast ${type}`},msg);
}

// ── Container form modal ──────────────────────────────────────────────────────
const EMPTY={container_number:'',container_size:'20ft',location:'Back Row',order_date:'',start_date:'',end_date:'',customer_name:'',joining_email_sent:false,id_check:false,phone:'',email:'',address1:'',address2:'',postcode:'',contract_signed:false,insurance:false,monthly_rate:'',intro_rate:'',intro_months:'',payment_status:'Pending',notes:''};

function ContainerModal({initial,onSave,onClose,onDelete}){
  const[form,setForm]=useState(initial?{...initial,joining_email_sent:!!initial.joining_email_sent,id_check:!!initial.id_check,contract_signed:!!initial.contract_signed,insurance:!!initial.insurance,start_date:initial.start_date?(initial.start_date+'').slice(0,10):'',end_date:initial.end_date?(initial.end_date+'').slice(0,10):'',order_date:initial.order_date?(initial.order_date+'').slice(0,10):'',intro_rate:initial.intro_rate!=null?String(initial.intro_rate):'',intro_months:initial.intro_months!=null?String(initial.intro_months):''}:{...EMPTY});
  const[saving,setSaving]=useState(false);
  const[err,setErr]=useState('');
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const submit=async()=>{
    if(!form.container_number.trim()){setErr('Container number is required');return;}
    setSaving(true);setErr('');
    try{
      const method=initial?'PUT':'POST';
      const path=initial?`/containers/${initial.id}`:'/containers';
      const data=await api(path,{method,body:{...form,start_date:form.start_date||null,end_date:form.end_date||null,order_date:form.order_date||null}});
      onSave(data);
    }catch(e){setErr(e.message);}finally{setSaving(false);}

    React.createElement('div',{className:'form-group '+(props.full?'full':'')},
      React.createElement('label',null,props.label),
      React.createElement('input',{type:props.type||'text',value:form[props.k]||'',onChange:e=>set(props.k,e.target.value),...(props.placeholder?{placeholder:props.placeholder}:{})})
    )

    React.createElement('label',null,props.label),

    React.createElement('input',{type:'checkbox',id:props.k,checked:!!form[props.k],onChange:e=>set(props.k,e.target.checked)}),
    React.createElement('label',{htmlFor:props.k},props.label)

        React.createElement('span',{className:'modal-title'},initial?`Edit Container — ${initial.container_number}`:'Add New Container'),
        React.createElement('button',{className:'modal-close',onClick:onClose},React.createElement(Icon,{name:'close',size:18}))),
      React.createElement('div',{className:'modal-body'},
        err&&React.createElement('div',{className:'form-error',style:{marginBottom:12}},err),
        React.createElement('div',{className:'form-grid'},
          React.createElement('div',{className:'form-section'},'Container Details'),
          F({k:'container_number',label:'Container #',placeholder:'e.g. C-025'}),
          React.createElement(Sel,{k:'container_size',label:'Size',opts:crmOpts.container_sizes}),
          React.createElement(Sel,{k:'location',label:'Location',opts:crmOpts.locations}),
          React.createElement('div',{className:'form-section'},'Rental Period'),
          F({k:'order_date',label:'Order Date',type:'date'}),
          F({k:'start_date',label:'Start Date',type:'date'}),
          F({k:'end_date',label:'End Date (blank = rolling)',type:'date'}),
          React.createElement(Sel,{k:'payment_status',label:'Payment Status',opts:crmOpts.payment_statuses}),
          React.createElement('div',{className:'form-group'},
            React.createElement('label',null,'Standard Monthly Rate (£)'),
            React.createElement('input',{type:'number',min:0,step:0.01,placeholder:'e.g. 135',value:form.monthly_rate||'',onChange:e=>set('monthly_rate',e.target.value)})
          ),
          React.createElement('div',{className:'form-group'},
            React.createElement('label',null,'Intro Rate (£)',React.createElement('span',{style:{fontWeight:400,color:'var(--text3)',marginLeft:4,fontSize:11}},'optional')),
            React.createElement('input',{type:'number',min:0,step:0.01,placeholder:'e.g. 99',value:form.intro_rate||'',onChange:e=>set('intro_rate',e.target.value)})

        React.createElement('button',{className:'btn btn-primary',onClick:submit,disabled:saving},saving?React.createElement('span',{className:'spinner'}):'Save Container')
      )
    )
  );
}

// ── Delete confirm modal ──────────────────────────────────────────────────────
function DeleteModal({container,onConfirm,onClose}){
  const[loading,setLoading]=useState(false);
  const go=async()=>{setLoading(true);await onConfirm();setLoading(false);};
  return React.createElement('div',{className:'overlay',onClick:e=>{if(e.target===e.currentTarget)onClose()}},
    React.createElement('div',{className:'modal',style:{maxWidth:400}},
      React.createElement('div',{className:'modal-header'},
        React.createElement('span',{className:'modal-title'},'Delete Container'),
        React.createElement('button',{className:'modal-close',onClick:onClose},React.createElement(Icon,{name:'close',size:18}))),
      React.createElement('div',{className:'modal-body'},
        React.createElement('p',{style:{color:'var(--text2)',lineHeight:1.6}},
          `This will permanently delete container `,React.createElement('strong',{style:{color:'var(--text)'}},container.container_number),
          container.customer_name?` (assigned to ${container.customer_name})`:'',
          `. This action cannot be undone.`
        )
      ),
      React.createElement('div',{className:'modal-footer'},
        React.createElement('button',{className:'btn btn-ghost',onClick:onClose},'Cancel'),
        React.createElement('button',{className:'btn btn-danger',onClick:go,disabled:loading},loading?React.createElement('span',{className:'spinner'}):'Delete')
      )
    )
  );
}



// ── Prospect status badge helper ──────────────────────────────────────────────
function prospectStatusBadge(s){

function ProspectModal({prospect,onClose,onSaved}){
  const{showToast}=useApp();
  const opts=window.getCRMOptions();
  const sources=(opts.lead_sources||[]).filter(Boolean);
  const statuses=(opts.prospect_statuses||[]).filter(Boolean);
  const EMPTY_P={name:'',email:'',phone:'',address1:'',address2:'',postcode:'',source:'',status:'New',notes:''};
  const[form,setForm]=useState(prospect?{...prospect}:{...EMPTY_P});
  const[saving,setSaving]=useState(false);
  const[err,setErr]=useState('');
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const FI=(k,label,type)=>React.createElement('div',{className:'form-group'},
    React.createElement('label',null,label),
    React.createElement('input',{type:type||'text',value:form[k]||'',onChange:e=>set(k,e.target.value)})
  );
  const save=async()=>{
    if(!form.name.trim()){setErr('Name is required');return;}
    setSaving(true);setErr('');
    try{
      const method=prospect?'PUT':'POST';
      const url=prospect?'/prospects/'+prospect.id:'/prospects';
      const saved=await api(url,{method,body:form});
      showToast(prospect?'Prospect updated':'Prospect added','success');
      onSaved(saved,!!prospect);
      onClose();
    }catch(e){setErr(e.message);}
    finally{setSaving(false);}
  };
  return React.createElement('div',{className:'overlay',onClick:e=>e.target===e.currentTarget&&onClose()},
    React.createElement('div',{className:'modal'},
      React.createElement('div',{className:'modal-header'},
        React.createElement('div',{className:'modal-title'},prospect?'Edit Prospect':'Add Prospect'),
        React.createElement('button',{className:'modal-close',onClick:onClose},React.createElement(Icon,{name:'close',size:18}))
      ),
      React.createElement('div',{className:'modal-body'},
        err&&React.createElement('div',{className:'login-error'},err),
        React.createElement('div',{className:'form-grid'},
          React.createElement('div',{className:'form-section'},'Contact Details'),
          FI('name','Full Name'),
          FI('email','Email Address','email'),
          FI('phone','Phone Number','tel'),
          FI('address1','Address Line 1'),
          FI('address2','Address Line 2'),
          FI('postcode','Postcode'),
          React.createElement('div',{className:'form-section'},'Prospect Details'),
          React.createElement('div',{className:'form-group'},
            React.createElement('label',null,'Lead Source'),
            React.createElement('select',{value:form.source||'',onChange:e=>set('source',e.target.value)},
              React.createElement('option',{value:''},'— Select source —'),

          React.createElement('div',{className:'form-group'},
            React.createElement('label',null,'Status'),
            React.createElement('select',{value:form.status||'New',onChange:e=>set('status',e.target.value)},
              statuses.map(s=>React.createElement('option',{key:s,value:s},s))
            )
          ),
          React.createElement('div',{className:'form-group full'},
            React.createElement('label',null,'Notes'),
            React.createElement('textarea',{value:form.notes||'',rows:3,style:{resize:'vertical'},onChange:e=>set('notes',e.target.value)})
          )
        )
      ),
      React.createElement('div',{className:'modal-footer'},
        React.createElement('button',{className:'btn btn-ghost',onClick:onClose},'Cancel'),
        React.createElement('button',{className:'btn btn-primary',onClick:save,disabled:saving},saving?'Saving\u2026':'Save Prospect')

// ── Income page ───────────────────────────────────────────────────────────────
function IncomePage(){
  const now=new Date();
  const[year,setYear]=useState(now.getFullYear());
  const[month,setMonth]=useState(now.getMonth()+1);
  const[data,setData]=useState(null);
  const[err,setErr]=useState('');
  const[tooltip,setTooltip]=useState(null); // {day, tenants, amount, rect}
  const{sorted:sortedIncome,sortKey:iSK,sortDir:iSD,toggle:iToggle}=useSortedData(data?data.rows:null,'customer_name','asc');

  useEffect(()=>{
    setData(null);setErr('');
    api(`/income?year=${year}&month=${month}`)
      .then(setData)
      .catch(e=>{setErr(e.message);setData({rows:[],summary:{total_expected:0,total_paid:0,total_overdue:0,total_pending:0,count:0,daily:{}}});});
  },[year,month]);

  const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const prevMonth=()=>{if(month===1){setMonth(12);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextMonth=()=>{
    const n=new Date();
    if(year>n.getFullYear()||(year===n.getFullYear()&&month>=n.getMonth()+1))return;
    if(month===12){setMonth(1);setYear(y=>y+1);}else setMonth(m=>m+1);
  };
  const isCurrentMonth=year===now.getFullYear()&&month===now.getMonth()+1;
  const periodLabel=MONTH_NAMES[month-1]+' '+year;

  // ── Next billing date helper (client-side, matches server logic) ─────────────
  const nextBillingLabel=(r)=>{
    if(!r.next_billing_date)return '\u2014';
    const d=new Date(r.next_billing_date);
    const today=new Date();today.setHours(0,0,0,0);
    const diff=Math.round((d-today)/(1000*60*60*24));
    const dateStr=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    if(diff===0)return React.createElement('span',{style:{color:'var(--blue)',fontWeight:700}},dateStr+' (today)');
    if(diff<0)return React.createElement('span',{style:{color:'var(--text3)'}},dateStr);
    if(diff<=7)return React.createElement('span',{style:{color:'var(--amber)',fontWeight:600}},dateStr+' ('+diff+'d)');
    return React.createElement('span',{style:{color:'var(--text2)'}},dateStr);
  };

  // ── CSV export ────────────────────────────────────────────────────────────────
  const exportCSV=()=>{
    if(!data||!data.rows.length)return;
    const cols=[
      ['Customer','customer_name'],['Container','container_number'],
      ['Size','container_size'],['Location','location'],
      ['Email','email'],['Phone','phone'],
      ['Start Date','start_date'],['End Date','end_date'],
      ['Monthly Rate (£)','monthly_rate'],['Effective Rate (£)','effective_rate'],
      ['Next Billing Date','next_billing_date'],['Payment Status','payment_status'],
    ];
    const esc=v=>{if(v===null||v===undefined)return'';const s=String(v);return s.includes(',')||s.includes('"')||s.includes('\n')?`"${s.replace(/"/g,'""')}"`  :s;};
    const fmtD=v=>v?new Date(v).toLocaleDateString('en-GB'):'';
    const dateFs=new Set(['start_date','end_date','next_billing_date']);
    const numFs=new Set(['monthly_rate','effective_rate']);
    const lines=[
      `Income Report — ${periodLabel}`,'',
      cols.map(([h])=>h).join(','),
      ...data.rows.map(r=>cols.map(([,k])=>{const v=r[k];if(dateFs.has(k))return esc(fmtD(v));if(numFs.has(k))return v!=null?v.toFixed(2):'0.00';return esc(v);}).join(',')),
      '',
      `Total Expected,£${data.summary.total_expected.toFixed(2)}`,
      `Total Paid / DD,£${data.summary.total_paid.toFixed(2)}`,
      `Total Overdue,£${data.summary.total_overdue.toFixed(2)}`,
      `Total Pending,£${data.summary.total_pending.toFixed(2)}`,
    ].join('\n');
    const blob=new Blob(['\uFEFF'+lines],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;

                React.createElement('span',{style:{opacity:.85}},t.name+' ('+t.container+')'),

        )

          React.createElement('div',{key:d,className:'cal-dow'},d)

  };

  const SkRow=()=>React.createElement('tr',null,
    [...Array(8)].map((_,i)=>React.createElement('td',{key:i},
      React.createElement('span',{className:'skel',style:{width:['55%','30%','25%','35%','30%','35%','30%','25%'][i]}},'\u00a0')

  const s=data?data.summary:null;

  return React.createElement('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},

// ── Dashboard page ────────────────────────────────────────────────────────────
function DashboardPage(){
  const MONTH_OPTIONS=[6,9,12];
  const[stats,setStats]=useState(null);
  const[revMonths,setRevMonths]=useState(12);
  const[occMonths,setOccMonths]=useState(12);
  const[revData,setRevData]=useState(null);
  const[occData,setOccData]=useState(null);
  useEffect(()=>{api('/dashboard').then(setStats).catch(()=>{})},[]);
  useEffect(()=>{setRevData(null);api(`/dashboard/revenue-trend?months=${revMonths}`).then(setRevData).catch(()=>setRevData([]));},[revMonths]);
  useEffect(()=>{setOccData(null);api(`/dashboard/occupancy-trend?months=${occMonths}`).then(setOccData).catch(()=>setOccData([]));},[occMonths]);

  // ── SVG bar chart renderer ──────────────────────────────────────────────────
  function BarChart({data,valueKey,color,prefix,suffix,height}){
    if(!data||!data.length)return React.createElement('div',{style:{height,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)',fontSize:13}},'No data yet');
    const vals=data.map(d=>d[valueKey]);
    const maxV=Math.max(...vals,1);
    const W=600,H=height||200,PAD_L=54,PAD_R=12,PAD_T=16,PAD_B=42;
    const chartW=W-PAD_L-PAD_R,chartH=H-PAD_T-PAD_B;
    const n=data.length;
    const barW=Math.min(36,Math.floor(chartW/n*0.55));
    const gap=chartW/n;
    // Y grid lines
    const ticks=4;
    const grids=Array.from({length:ticks+1},(_,i)=>Math.round(maxV/ticks*i));
    return React.createElement('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',height},preserveAspectRatio:'none'},
      // grid lines
      ...grids.map((v,i)=>{
        const y=PAD_T+chartH-(v/maxV)*chartH;
        return React.createElement('g',{key:i},
          React.createElement('line',{x1:PAD_L,y1:y,x2:W-PAD_R,y2:y,stroke:'var(--border)',strokeWidth:.8}),
          React.createElement('text',{x:PAD_L-6,y:y+4,textAnchor:'end',fontSize:9,fill:'var(--text3)',fontFamily:'var(--mono)'},
            (prefix||'')+(v>=1000?(v/1000).toFixed(1)+'k':v)+(suffix||''))
        );
      }),
      // bars + labels
      ...data.map((d,i)=>{
        const x=PAD_L+gap*i+gap/2-barW/2;
        const barH=Math.max(2,(d[valueKey]/maxV)*chartH);
        const y=PAD_T+chartH-barH;
        const isLast=i===n-1;
        return React.createElement('g',{key:i},

  };
  return React.createElement('div',{className:'login-wrap'},
    React.createElement('div',{className:'login-card'},
      React.createElement('div',{className:'login-logo'},
        React.createElement('div',{className:'login-logo-mark'},'Storage Management'),
        React.createElement('div',{className:'login-logo-name'},'Container',React.createElement('span',null,'CRM'))
      ),
      React.createElement('h2',null,'Sign in'),
      React.createElement('p',null,'Enter your credentials to access the CRM'),
      err&&React.createElement('div',{className:'login-error'},err),
      React.createElement('form',{onSubmit:submit},
        React.createElement('div',{className:'login-field'},
          React.createElement('label',null,'Username'),
          React.createElement('input',{type:'text',value:u,onChange:e=>setU(e.target.value),autoFocus:true,autoComplete:'username'})
        ),
        React.createElement('div',{className:'login-field'},
          React.createElement('label',null,'Password'),
          React.createElement('input',{type:'password',value:p,onChange:e=>setP(e.target.value),autoComplete:'current-password'})
        ),
        React.createElement('button',{type:'submit',className:'login-btn',disabled:loading},loading?'Signing in…':'Sign In')
      ),
      React.createElement('div',{style:{marginTop:18,textAlign:'center',fontSize:12,color:'var(--text2)'}},
        'New storage business? ',
        React.createElement('span',{style:{color:'var(--blue)',cursor:'pointer',fontWeight:600},onClick:onShowSignup},'Create a free account')
      )
    )
  );
}

// ── App shell ─────────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[company,setCompany]=useState(null);
  const[page,setPage]=useState('dashboard');
  const[selectedCustomer,setSelectedCustomer]=useState(null);
  const[toast,setToast]=useState(null);
  const[loading,setLoading]=useState(true);
  const[showSignup,setShowSignup]=useState(false);
  const showToast=(msg,type='success')=>setToast({msg,type,id:Date.now()});

  const loadSettings=async()=>{
    try{const s=await api('/settings');window.setCRMOptions(s);}catch(e){}
  };

  useEffect(()=>{
    const t=localStorage.getItem('crm_token');
    if(t){
      api('/auth/me')
        .then(u=>{
          setUser(u);
          setCompany({id:u.company_id,name:u.company_name,plan:u.plan,trial_ends_at:u.trial_ends_at});
          return loadSettings();
        })
        .then(()=>setLoading(false))
        .catch(()=>{localStorage.removeItem('crm_token');setLoading(false);});
    } else setLoading(false);
  },[]);

  const handleLogin=(u,co)=>{setUser(u);setCompany(co);loadSettings();};
  const handleSignup=(u,co)=>{setUser(u);setCompany(co);loadSettings();};
  const logout=()=>{localStorage.removeItem('crm_token');setUser(null);setCompany(null);window._crmOptions=null;};
  const goCustomer=name=>{setSelectedCustomer(name);setPage('customers');};
  const backToCustomers=()=>setSelectedCustomer(null);

  if(loading)return React.createElement('div',{className:'login-wrap'},React.createElement('span',{className:'spinner'}));

  if(!user){
    if(showSignup)return React.createElement(AppCtx.Provider,{value:{showToast}},
      React.createElement(SignupPage,{onSignup:handleSignup,onBack:()=>setShowSignup(false)})
    );
    return React.createElement(AppCtx.Provider,{value:{showToast}},
      React.createElement(LoginPage,{onLogin:handleLogin,onShowSignup:()=>setShowSignup(true)})
    );
  }

  const navItems=[
    {id:'dashboard',icon:'dashboard',label:'Dashboard'},
    {id:'containers',icon:'containers',label:'Containers'},
    {id:'customers',icon:'person',label:'Customers'},
    {id:'prospects',icon:'idcard',label:'Prospects'},
    {id:'income',icon:'income',label:'Income'},
    {id:'history',icon:'archive',label:'Rental History'},
    {id:'settings',icon:'settings',label:'Settings'},
  ];

  const pageTitle=page==='customers'&&selectedCustomer?[selectedCustomer,'Customer record']:
    {dashboard:['Dashboard','Overview & key metrics'],
     containers:['Containers','Manage all storage units & customers'],
     customers:['Customers','All tenants & contacts'],
     prospects:['Prospects','Track leads & prospective customers'],
     income:['Income','Monthly payment itemisation by customer'],
     history:['Rental History','Archived tenant records'],
     settings:['Settings','Account & user management']}[page]||['',''];

  const pageContent={
    dashboard:React.createElement('div',{style:{flex:1,overflowY:'auto',padding:'24px'}},React.createElement(DashboardPage)),
    containers:React.createElement(ContainersPage),
    customers:selectedCustomer
      ?React.createElement(CustomerDetailPage,{name:selectedCustomer,onBack:backToCustomers})
      :React.createElement(CustomersPage,{onSelect:goCustomer}),
    prospects:React.createElement(ProspectsPage),
    income:React.createElement(IncomePage),
    history:React.createElement(HistoryPage),
    settings:React.createElement('div',{style:{flex:1,overflowY:'auto',padding:'24px'}},React.createElement(SettingsPage)),
  };

  const trialBanner=()=>{
    if(!company||company.plan==='active')return null;
    const daysLeft=company.trial_ends_at
      ?Math.max(0,Math.ceil((new Date(company.trial_ends_at)-new Date())/(1000*60*60*24))):0;
    if(company.plan==='suspended')return React.createElement('div',{style:{
      background:'#fee2e2',color:'#dc2626',padding:'8px 20px',fontSize:12,fontWeight:600,
      display:'flex',alignItems:'center',gap:8,borderBottom:'1px solid #fca5a5',flexShrink:0
    }},React.createElement(Icon,{name:'warn',size:14}),'Your account has been suspended. ',
      React.createElement('span',{style:{textDecoration:'underline',cursor:'pointer'},onClick:()=>setPage('settings')},'Update billing'));
    return React.createElement('div',{style:{
      background:daysLeft<=3?'#fee2e2':daysLeft<=7?'#fef3c7':'#eff6ff',
      color:daysLeft<=3?'#dc2626':daysLeft<=7?'#b45309':'#1d4ed8',
      padding:'6px 20px',fontSize:12,fontWeight:600,
      display:'flex',alignItems:'center',gap:8,
      borderBottom:'1px solid '+(daysLeft<=3?'#fca5a5':daysLeft<=7?'#fde68a':'#bfdbfe'),flexShrink:0
    }},
      'Free trial: ',daysLeft,' day'+(daysLeft!==1?'s':''),' remaining. ',
      React.createElement('span',{style:{marginLeft:6,textDecoration:'underline',cursor:'pointer'},onClick:()=>setPage('settings')},'Upgrade now')
    );
  };

  return React.createElement(AppCtx.Provider,{value:{user,company,showToast}},
    React.createElement('div',{className:'app-shell'},
      React.createElement('nav',{className:'sidebar'},
        React.createElement('div',{className:'sidebar-logo'},
          React.createElement('div',{className:'logo-mark'},company&&company.name||'StoreCRM'),
          React.createElement('div',{className:'logo-name'},'Container',React.createElement('span',null,'CRM'))
        ),
        React.createElement('div',{className:'sidebar-nav'},
          React.createElement('div',{className:'nav-section'},'Menu'),
          ...navItems.map(item=>React.createElement('div',{
            key:item.id,
            className:'nav-item '+(page===item.id?'active':''),
            onClick:()=>{setPage(item.id);if(item.id!=='customers')setSelectedCustomer(null);}
          },React.createElement(Icon,{name:item.icon,size:15}),item.label)),
          React.createElement('div',{className:'nav-item',onClick:logout,style:{marginTop:8}},
            React.createElement(Icon,{name:'logout',size:15}),'Sign Out')
        ),
        React.createElement('div',{className:'sidebar-footer'},
          React.createElement('div',{className:'user-pill'},
            React.createElement('div',{className:'avatar'},(user.username||'?')[0].toUpperCase()),
            React.createElement('div',{className:'user-info'},
              React.createElement('div',{className:'user-name'},user.full_name||user.username),
              React.createElement('div',{className:'user-role'},user.role)
            )
          )
        )
      ),
      React.createElement('main',{className:'main'},
        trialBanner(),
        React.createElement('div',{className:'topbar'},
          React.createElement('div',null,
            React.createElement('div',{className:'page-title'},pageTitle[0]),
            React.createElement('div',{className:'page-subtitle'},pageTitle[1])
          )
        ),
        React.createElement('div',{className:'content'},pageContent[page])
      )
    ),
    toast&&React.createElement(Toast,{key:toast.id,msg:toast.msg,type:toast.type,onDone:()=>setToast(null)})
  );
}

ReactDOM.render(React.createElement(App),document.getElementById('root'));
</script>
</body>
</html>
</body>
</html>
