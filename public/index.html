<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>StorageCRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e1117;--surface:#161b27;--surface2:#1e2535;--surface3:#252d40;
  --border:#2a3347;--border2:#3a4560;
  --text:#e8eaf0;--text2:#9aa3b8;--text3:#5a6478;
  --blue:#3b82f6;--blue-dim:#1d3c6e;--blue-glow:rgba(59,130,246,.15);
  --green:#22c55e;--green-dim:#14532d;--green-glow:rgba(34,197,94,.12);
  --red:#ef4444;--red-dim:#450a0a;
  --orange:#f97316;--orange-dim:#431407;
  --amber:#f59e0b;--amber-dim:#451a03;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
  --radius:8px;--radius-lg:12px;
}
html,body,#root{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Layout ── */
.app-shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0}
.sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.logo-mark{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.15em;color:var(--text3);text-transform:uppercase;margin-bottom:4px}
.logo-name{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.logo-name span{color:var(--blue)}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-section{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding:12px 10px 6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13.5px;font-weight:500;transition:all .15s;margin-bottom:1px;border:1px solid transparent}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--blue-glow);color:var(--blue);border-color:var(--blue-dim)}
.nav-item svg{flex-shrink:0;opacity:.8}
.nav-item.active svg{opacity:1}
.sidebar-footer{padding:12px 8px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);background:var(--surface2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue-dim);border:1px solid var(--blue-dim);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--blue);flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:10px;color:var(--text3)}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:52px;border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);flex-shrink:0}
.page-title{font-size:14px;font-weight:600;color:var(--text)}
.page-subtitle{font-size:11px;color:var(--text3);margin-top:1px}
.topbar-actions{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:24px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);border:1px solid;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:var(--sans)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:#2563eb;border-color:#2563eb}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text2)}
.btn-ghost:hover{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.btn-danger{background:transparent;border-color:var(--red-dim);color:var(--red)}
.btn-danger:hover{background:var(--red-dim)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── KPI cards ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi-card.blue::before{background:var(--blue)}
.kpi-card.green::before{background:var(--green)}
.kpi-card.orange::before{background:var(--orange)}
.kpi-card.red::before{background:var(--red)}
.kpi-card.amber::before{background:var(--amber)}
.kpi-label{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.kpi-value{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--text);line-height:1}
.kpi-value.blue{color:var(--blue)}
.kpi-value.green{color:var(--green)}
.kpi-value.orange{color:var(--orange)}
.kpi-value.red{color:var(--red)}
.kpi-value.amber{color:var(--amber)}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:4px}

/* ── Table ── */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.table-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px 7px 32px;color:var(--text);font-size:13px;outline:none;font-family:var(--sans);transition:border-color .15s}
.search-box input:focus{border-color:var(--blue)}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text3)}
.filter-select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;color:var(--text);font-size:13px;outline:none;cursor:pointer;font-family:var(--sans)}
.filter-select:focus{border-color:var(--blue)}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:10px 14px;text-align:left;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
tbody tr.occupied{background:rgba(34,197,94,.04)}
tbody tr.occupied:hover{background:rgba(34,197,94,.08)}
tbody tr.expiring{background:rgba(249,115,22,.05)}
tbody tr.expiring:hover{background:rgba(249,115,22,.1)}
td{padding:10px 14px;color:var(--text2);vertical-align:middle;white-space:nowrap}
td.primary{color:var(--text);font-weight:500;font-family:var(--mono);font-size:12px}
td.notes-cell{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.empty-row td{text-align:center;padding:40px;color:var(--text3)}

/* ── Status + badges ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;font-family:var(--mono);letter-spacing:.05em;white-space:nowrap}
.badge-occupied{background:var(--green-dim);color:#4ade80;border:1px solid #14532d}
.badge-vacant{background:var(--surface3);color:var(--text3);border:1px solid var(--border)}
.badge-paid{background:rgba(34,197,94,.12);color:#4ade80}
.badge-overdue{background:var(--red-dim);color:#f87171}
.badge-pending{background:var(--amber-dim);color:#fbbf24}
.badge-dd{background:var(--blue-dim);color:#93c5fd}
.badge-yes{color:var(--green);font-size:12px}
.badge-no{color:var(--text3);font-size:12px}
.expiry-warn{color:var(--orange);font-family:var(--mono);font-size:12px}
.expiry-ok{color:var(--text3);font-family:var(--mono);font-size:12px}
.expiry-expired{color:var(--red);font-family:var(--mono);font-size:12px}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:700px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 10px;color:var(--text);font-size:13px;outline:none;width:100%;
  font-family:var(--sans);transition:border-color .15s;
  color-scheme:dark
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:var(--surface3)}
textarea{resize:vertical;min-height:64px}
.checkbox-row{display:flex;align-items:center;gap:8px;padding:9px 0}
.checkbox-row label{text-transform:none;letter-spacing:0;font-size:13px;font-weight:400;color:var(--text);cursor:pointer}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
.form-section{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding:14px 0 8px;border-bottom:1px solid var(--border);margin-bottom:14px;grid-column:1/-1}
.form-error{color:var(--red);font-size:12px;margin-top:4px}

/* ── Alert/notice ── */
.alert{padding:12px 16px;border-radius:var(--radius);font-size:13px;display:flex;align-items:flex-start;gap:8px;margin-bottom:16px}
.alert-warn{background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.25);color:var(--orange)}
.alert-info{background:var(--blue-glow);border:1px solid var(--blue-dim);color:var(--blue)}

/* ── Login page ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;width:100%;max-width:380px}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo-mark{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--text3);text-transform:uppercase;margin-bottom:8px}
.login-logo-name{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.login-logo-name span{color:var(--blue)}
.login-card h2{font-size:17px;font-weight:600;margin-bottom:4px}
.login-card p{color:var(--text3);font-size:13px;margin-bottom:24px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.login-error{color:var(--red);font-size:13px;padding:10px;background:var(--red-dim);border-radius:var(--radius);margin-bottom:14px;text-align:center}
.login-btn{width:100%;padding:10px;font-size:14px;font-weight:600;background:var(--blue);border:none;border-radius:var(--radius);color:#fff;cursor:pointer;transition:background .15s;font-family:var(--sans)}
.login-btn:hover{background:#2563eb}
.login-hint{text-align:center;font-size:11px;color:var(--text3);margin-top:16px;font-family:var(--mono)}

/* ── Expiry section ── */
.expiry-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.expiry-item{background:var(--surface);border:1px solid rgba(249,115,22,.3);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:14px}
.expiry-days{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--orange);min-width:40px}
.expiry-info{flex:1}
.expiry-container{font-weight:600;font-size:13px}
.expiry-customer{font-size:12px;color:var(--text3)}
.section-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title svg{color:var(--orange)}

/* ── Settings page ── */
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:16px}
.settings-card h3{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--text)}
.users-table{width:100%;border-collapse:collapse;font-size:13px}
.users-table th{text-align:left;padding:8px 12px;font-size:10px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border)}
.users-table td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text2)}
.users-table tr:last-child td{border-bottom:none}

/* ── Loading / toast ── */
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:2000;animation:slideUp .2s ease;max-width:320px}
.toast.success{border-color:var(--green-dim);color:var(--green)}
.toast.error{border-color:var(--red-dim);color:var(--red)}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── Responsive ── */
@media(max-width:900px){
  .sidebar{display:none}
  .form-grid{grid-template-columns:1fr}
  .form-grid.cols-3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useCallback,useRef,createContext,useContext}=React;

// ── API helper ────────────────────────────────────────────────────────────────
const api=async(path,opts={})=>{
  const token=localStorage.getItem('crm_token');
  const headers={'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})};
  const r=await fetch('/api'+path,{headers,...opts,body:opts.body?JSON.stringify(opts.body):undefined});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.error||'Request failed');
  return data;
};

// ── Context ───────────────────────────────────────────────────────────────────
const AppCtx=createContext(null);
function useApp(){return useContext(AppCtx);}

// ── Icons (SVG inline) ────────────────────────────────────────────────────────
const Icon=({name,size=16,style={}})=>{
  const icons={
    dashboard:`<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>`,
    containers:`<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/>`,
    settings:`<circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>`,
    logout:`<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>`,
    plus:`<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>`,
    search:`<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>`,
    edit:`<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>`,
    trash:`<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>`,
    warn:`<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>`,
    close:`<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`,
    box:`<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>`,
    users:`<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
    currency:`<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>`,
  };
  return React.createElement('svg',{xmlns:'http://www.w3.org/2000/svg',width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',style,dangerouslySetInnerHTML:{__html:icons[name]||''}});
};

// ── Helpers ───────────────────────────────────────────────────────────────────
const fmt=(v)=>v?new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const payBadge=(s)=>{
  if(!s)return null;
  const cls={Paid:'badge-paid',Overdue:'badge-overdue',Pending:'badge-pending','Direct Debit':'badge-dd','Credit Note':'badge-dd'}[s]||'badge-pending';
  return React.createElement('span',{className:`badge ${cls}`},s);
};
const statusBadge=(s)=>React.createElement('span',{className:`badge ${s==='Occupied'?'badge-occupied':'badge-vacant'}`},s==='Occupied'?'● OCCUPIED':'○ VACANT');
const bool=(v)=>React.createElement('span',{className:v?'badge-yes':'badge-no'},v?'✓':'—');

// ── Toast ─────────────────────────────────────────────────────────────────────
function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3200);return()=>clearTimeout(t)},[]);
  return React.createElement('div',{className:`toast ${type}`},msg);
}

// ── Container form modal ──────────────────────────────────────────────────────
const EMPTY={container_number:'',container_size:'20ft',location:'Back Row',order_date:'',start_date:'',end_date:'',customer_name:'',joining_email_sent:false,id_check:false,phone:'',email:'',address1:'',address2:'',postcode:'',contract_signed:false,insurance:false,monthly_rate:'',payment_status:'Pending',notes:''};

function ContainerModal({initial,onSave,onClose}){
  const[form,setForm]=useState(initial?{...initial,joining_email_sent:!!initial.joining_email_sent,id_check:!!initial.id_check,contract_signed:!!initial.contract_signed,insurance:!!initial.insurance,start_date:initial.start_date||'',end_date:initial.end_date||'',order_date:initial.order_date||''}:{...EMPTY});
  const[saving,setSaving]=useState(false);
  const[err,setErr]=useState('');
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const submit=async()=>{
    if(!form.container_number.trim()){setErr('Container number is required');return;}
    setSaving(true);setErr('');
    try{
      const method=initial?'PUT':'POST';
      const path=initial?`/containers/${initial.id}`:'/containers';
      const data=await api(path,{method,body:{...form,start_date:form.start_date||null,end_date:form.end_date||null,order_date:form.order_date||null}});
      onSave(data);

    React.createElement('div',{className:'login-card'},

        React.createElement('div',{className:'login-logo-mark'},'Storage Management'),
        React.createElement('div',{className:'login-logo-name'},'Container',React.createElement('span',null,'CRM'))
      ),
      React.createElement('h2',null,'Sign in'),
      React.createElement('p',null,'Enter your credentials to access the CRM'),
      err&&React.createElement('div',{className:'login-error'},err),
      React.createElement('form',{onSubmit:submit},
        React.createElement('div',{className:'login-field'},
          React.createElement('label',null,'Username'),
          React.createElement('input',{type:'text',value:u,onChange:e=>setU(e.target.value),autoFocus:true,autoComplete:'username'})
        ),
        React.createElement('div',{className:'login-field'},
          React.createElement('label',null,'Password'),
          React.createElement('input',{type:'password',value:p,onChange:e=>setP(e.target.value),autoComplete:'current-password'})
        ),
        React.createElement('button',{type:'submit',className:'login-btn',disabled:loading},loading?'Signing in…':'Sign In')
      ),
      React.createElement('div',{className:'login-hint'},'Default: admin / admin123')
    )
  );
}

// ── App shell ─────────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[page,setPage]=useState('dashboard');
  const[toast,setToast]=useState(null);
  const[loading,setLoading]=useState(true);
  const showToast=(msg,type='success')=>setToast({msg,type,id:Date.now()});
  useEffect(()=>{
    const t=localStorage.getItem('crm_token');
    if(t)api('/auth/me').then(u=>{setUser(u);setLoading(false);}).catch(()=>{localStorage.removeItem('crm_token');setLoading(false);});
    else setLoading(false);
  },[]);
  const logout=()=>{localStorage.removeItem('crm_token');setUser(null);};
  if(loading)return React.createElement('div',{className:'login-wrap'},React.createElement('span',{className:'spinner'}));
  if(!user)return React.createElement(AppCtx.Provider,{value:{showToast}},React.createElement(LoginPage,{onLogin:u=>{setUser(u)}}));
  const navItems=[
    {id:'dashboard',icon:'dashboard',label:'Dashboard'},
    {id:'containers',icon:'containers',label:'Containers'},
    {id:'settings',icon:'settings',label:'Settings'},
  ];
  const pageTitles={dashboard:['Dashboard','Overview & key metrics'],containers:['Containers','Manage all storage units & customers'],settings:['Settings','Account & user management']};
  const pageContent={dashboard:React.createElement(DashboardPage),containers:React.createElement(ContainersPage),settings:React.createElement(SettingsPage)};
  return React.createElement(AppCtx.Provider,{value:{user,showToast}},
    React.createElement('div',{className:'app-shell'},
      React.createElement('nav',{className:'sidebar'},
        React.createElement('div',{className:'sidebar-logo'},
          React.createElement('div',{className:'logo-mark'},'Storage Management'),
          React.createElement('div',{className:'logo-name'},'Container',React.createElement('span',null,'CRM'))
        ),
        React.createElement('div',{className:'sidebar-nav'},
          React.createElement('div',{className:'nav-section'},'Menu'),
          ...navItems.map(item=>React.createElement('div',{key:item.id,className:'nav-item '+(page===item.id?'active':''),onClick:()=>setPage(item.id)},
            React.createElement(Icon,{name:item.icon,size:15}),item.label
          )),
          React.createElement('div',{className:'nav-item',onClick:logout,style:{marginTop:8}},React.createElement(Icon,{name:'logout',size:15}),'Sign Out')
        ),
        React.createElement('div',{className:'sidebar-footer'},
          React.createElement('div',{className:'user-pill'},
            React.createElement('div',{className:'avatar'},(user.username||'?')[0].toUpperCase()),
            React.createElement('div',{className:'user-info'},
              React.createElement('div',{className:'user-name'},user.full_name||user.username),
              React.createElement('div',{className:'user-role'},user.role)
            )
          )
        )
      ),
      React.createElement('main',{className:'main'},
        React.createElement('div',{className:'topbar'},
          React.createElement('div',null,
            React.createElement('div',{className:'page-title'},pageTitles[page][0]),
            React.createElement('div',{className:'page-subtitle'},pageTitles[page][1])
          )
        ),
        React.createElement('div',{className:'content'},pageContent[page])
      )
    ),
    toast&&React.createElement(Toast,{key:toast.id,msg:toast.msg,type:toast.type,onDone:()=>setToast(null)})
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
